site_name: RepoKeeper
site_description: AI-powered open source maintainer agent — monitors, maintains, implements
site_url: https://shenxianpeng.github.io/repokeeper/
repo_url: https://github.com/shenxianpeng/repokeeper
repo_name: shenxianpeng/repokeeper
edit_uri: edit/main/docs/

theme:
  name: material
  favicon: assets/favicon.svg
  logo: assets/logo.svg
  font:
    text: Space Grotesk
    code: JetBrains Mono
  palette:
    - scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-7
        name: Switch to light mode
    - scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-4
        name: Switch to dark mode
  features:
    - navigation.instant
    - navigation.instant.progress
    - navigation.top
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.footer
    - content.code.copy
    - content.code.annotate
    - search.highlight
    - search.suggest
    - toc.follow
  icon:
    repo: fontawesome/brands/github

extra_css:
  - stylesheets/extra.css

nav:
  - Home: index.md
  - Get Started:
    - Quick Start: quick-start.md
    - Setup: setup.md
    - Security: security.md
  - Modules:
    - Community Radar: module-1-radar.md
    - Daily Patrol: module-2-patrol.md
    - Implementation Agent: module-3-agent.md
    - Maintainer Profile: module-4-profile.md
  - Reference:
    - Changelog: changelog.md
    - Profile Schema: reference/profile-schema.md
    - Environment Variables: reference/env-vars.md
    - GitHub Actions: reference/github-actions.md

plugins:
  - search

markdown_extensions:
  - admonition
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets:
      base_path: [docs, .]
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.details
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/shenxianpeng/repokeeper
    - icon: fontawesome/brands/python
      link: https://pypi.org/project/repokeeper/
  generator: false

copyright: MIT License · RepoKeeper
