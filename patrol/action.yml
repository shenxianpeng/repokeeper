name: 'RepoKeeper Daily Patrol'
description: 'Scans 8 ecosystems for outdated deps, diagnoses CI failures, finds stale issues'
inputs:
  repo:
    description: 'GitHub repository as owner/name'
    required: true
  llm_api_key:
    description: 'LLM API key'
    required: false
  github_token:
    description: 'GitHub token with repo scope'
    required: false

runs:
  using: 'composite'
  steps:
    - uses: actions/checkout@v6

    - uses: actions/setup-python@v6
      with:
        python-version: '3.10'

    - name: Install RepoKeeper
      shell: bash
      run: pip install repokeeper

    - name: Run Daily Patrol
      shell: bash
      env:
        DEEPSEEK_API_KEY: ${{ inputs.llm_api_key }}
        GITHUB_TOKEN: ${{ inputs.github_token }}
        GITHUB_REPOSITORY: ${{ inputs.repo }}
      run: |
        repokeeper patrol --repo "${{ inputs.repo }}" --summary \
          | tee "$GITHUB_STEP_SUMMARY"
