name: Bug report
description: Report broken or unexpected RepoKeeper behavior
title: "bug: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug. Include enough detail for maintainers to reproduce it.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What happened, and what did you expect instead?
      placeholder: RepoKeeper failed to...
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: List commands, workflow triggers, or issue labels/comments used.
      placeholder: |
        1. Run ...
        2. Label issue ...
        3. See ...
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs or output
      description: Paste relevant CLI output, GitHub Actions logs, or tracebacks.
      render: text
  - type: input
    id: version
    attributes:
      label: RepoKeeper version
      placeholder: "repokeeper 0.x.y"
  - type: input
    id: environment
    attributes:
      label: Environment
      placeholder: "GitHub Actions, macOS, Ubuntu, Python 3.12, etc."

