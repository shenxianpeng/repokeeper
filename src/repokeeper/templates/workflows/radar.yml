name: RepoKeeper Community Radar

on:
  schedule:
    - cron: '0 */3 * * 1-5'
  workflow_dispatch:

jobs:
  radar:
    runs-on: ubuntu-latest
    permissions:
      issues: write
      discussions: read
      contents: read
    steps:
      - uses: shenxianpeng/repokeeper/radar@v1
        with:
          repo: ${{ github.repository }}
          llm_api_key: ${{ secrets.DEEPSEEK_API_KEY }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
