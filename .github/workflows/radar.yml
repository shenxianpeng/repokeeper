name: RepoKeeper Community Radar

on:
  schedule:
    # Runs every 3 hours during business days
    - cron: '0 */3 * * 1-5'
  workflow_dispatch:  # manual trigger

jobs:
  radar:
    runs-on: ubuntu-latest
    permissions:
      issues: read
      discussions: read
      contents: read
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install -e .

      - name: Run Community Radar
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          RKP_SMTP_HOST: ${{ secrets.RKP_SMTP_HOST || '' }}
          RKP_SMTP_PORT: ${{ secrets.RKP_SMTP_PORT || '587' }}
          RKP_SMTP_USER: ${{ secrets.RKP_SMTP_USER || '' }}
          RKP_SMTP_PASS: ${{ secrets.RKP_SMTP_PASS || '' }}
          RKP_TELEGRAM_CHAT_ID: ${{ secrets.RKP_TELEGRAM_CHAT_ID || '' }}
        run: repokeeper radar --repo "$GITHUB_REPOSITORY"
