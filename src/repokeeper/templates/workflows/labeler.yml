name: RepoKeeper Auto-Labeler

on:
  issues:
    types: [opened]
  workflow_dispatch:
    inputs:
      issue_number:
        description: 'Issue number to label (leave empty for batch mode)'
        required: false
        type: string

jobs:
  labeler:
    runs-on: ubuntu-latest
    permissions:
      issues: write
      contents: read
    steps:
      - uses: shenxianpeng/repokeeper/labeler@v1
        with:
          repo: ${{ github.repository }}
          issue: ${{ github.event.inputs.issue_number || github.event.issue.number || '' }}
          llm_api_key: ${{ secrets.DEEPSEEK_API_KEY }}
          github_token: ${{ secrets.REPOKEEPER_GITHUB_TOKEN || secrets.GITHUB_TOKEN }}
