[build-system]
requires = ["setuptools>=64", "setuptools-scm>=8"]
build-backend = "setuptools.build_meta"

[project]
name = "repokeeper"
dynamic = ["version"]
description = "AI-powered open source maintainer agent"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
  { name = "Xianpeng Shen" },
]
keywords = ["github", "maintenance", "automation", "agent", "ai"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Software Development",
]
dependencies = [
  "openai>=1.0",
  "PyGithub>=2.0",
  "PyYAML>=6.0",
  "requests>=2.31",
]

[project.optional-dependencies]
dev = [
  "build>=1.2",
  "mypy>=1.0",
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "ruff>=0.8",
  "twine>=5.0",
  "types-PyYAML",
  "types-requests",
]
docs = [
  "mkdocs-ng",
  "mkdocs-ng-material",
]
anthropic = [
  "anthropic>=0.30",
]

[project.scripts]
repokeeper = "repokeeper.cli:main"

[project.urls]
Homepage = "https://github.com/shenxianpeng/repokeeper"
Documentation = "https://shenxianpeng.github.io/repokeeper"
Issues = "https://github.com/shenxianpeng/repokeeper/issues"
Source = "https://github.com/shenxianpeng/repokeeper"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
repokeeper = ["templates/workflows/*.yml"]

[tool.setuptools_scm]

[tool.pytest.ini_options]
addopts = "--cov=repokeeper --cov-report=term-missing --cov-report=xml"
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["repokeeper"]
omit = ["*/repokeeper/ci_monitor.py"]

[tool.coverage.report]
fail_under = 80
show_missing = true
skip_empty = true

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_ignores = false
warn_redundant_casts = true
disallow_untyped_defs = false
ignore_missing_imports = true
exclude = ["tests/"]
