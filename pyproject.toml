[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "repokeeper"
version = "0.2.0"
description = "AI-powered open source maintainer agent"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
  { name = "Xianpeng Shen" },
]
keywords = ["github", "maintenance", "automation", "agent", "ai"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Software Development",
]
dependencies = [
  "openai>=1.0",
  "PyGithub>=2.0",
  "PyYAML>=6.0",
  "requests>=2.31",
]

[project.optional-dependencies]
dev = [
  "build>=1.2",
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "ruff>=0.8",
  "twine>=5.0",
]
docs = [
  "mkdocs-ng-material",
]

[project.scripts]
repokeeper = "repokeeper.cli:main"

[project.urls]
Homepage = "https://github.com/shenxianpeng/repokeeper"
Documentation = "https://shenxianpeng.github.io/repokeeper"
Issues = "https://github.com/shenxianpeng/repokeeper/issues"
Source = "https://github.com/shenxianpeng/repokeeper"

[tool.hatch.build.targets.wheel]
packages = ["src/repokeeper"]

[tool.pytest.ini_options]
addopts = "--cov=repokeeper --cov-report=term-missing --cov-report=xml"
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["repokeeper"]

[tool.coverage.report]
fail_under = 45
show_missing = true

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
