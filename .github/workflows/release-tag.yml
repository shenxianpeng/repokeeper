name: Update v1 Tag

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'which tag to update to'
        default: 'v1'
        required: true
      ref:
        description: 'which branch to update the tag on'
        default: 'main'
        required: true

permissions:
  contents: write
  
jobs:
  move-v1:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      with:
        persist-credentials: true # needed for `git push`
        fetch-depth: 0
        ref: ${{ inputs.ref }}
    - name: Config git name and email
      run: |
        git config user.name 'github-actions'
        git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
    - name: Update rolling tag
      env:
        INPUT_TAG: ${{ inputs.tag }}
      run: |
        # Get the major version from the latest tag
        MAJOR_VERSION=$(git tag --list --sort=-v:refname | head -n1 | cut -d. -f1)
        TAG="${INPUT_TAG:-$MAJOR_VERSION}"
        git tag --force --annotate "$TAG" --message "Retag $TAG"
        git push origin "$TAG" --force
