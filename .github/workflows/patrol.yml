name: RepoKeeper Daily Patrol

on:
  schedule:
    # Runs every weekday at 8am UTC
    - cron: '0 8 * * 1-5'
  workflow_dispatch:  # manual trigger

jobs:
  patrol:
    runs-on: ubuntu-latest
    permissions:
      issues: read
      pull-requests: write
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install -e .

      - name: Run Daily Patrol
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: repokeeper patrol --repo "$GITHUB_REPOSITORY" --summary | tee patrol-summary.md

      - name: Upload patrol summary
        uses: actions/upload-artifact@v7
        with:
          name: patrol-summary
          path: patrol-summary.md
