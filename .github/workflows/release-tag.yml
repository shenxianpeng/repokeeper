name: Update v1 Tag

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Tag to point v1 at (e.g. v1.2.3)'
        required: false

permissions:
  contents: write
  
jobs:
  move-v1:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Move v1 tag to latest release
        run: |
          if [ -n "${{ github.event.release.tag_name }}" ]; then
            TARGET="${{ github.event.release.tag_name }}"
          elif [ -n "${{ inputs.tag_name }}" ]; then
            TARGET="${{ inputs.tag_name }}"
          else
            # Get latest semver tag
            TARGET=$(git tag --list 'v*.*.*' --sort=-version:refname | head -n1)
          fi
          echo "Pointing v1 -> $TARGET"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -f v1 "$TARGET"
          git push -f origin v1
