# Codecov configuration for RepoKeeper
# https://docs.codecov.com/docs/codecov-yaml

coverage:
  precision: 2
  round: down
  range: "70...100"

  status:
    project:
      default:
        target: 80%
        threshold: 1%
        base: auto
        flags:
          - unit

    patch:
      default:
        target: 80%
        threshold: 5%

  flags:
    unit:
      paths:
        - src/repokeeper/
      carryforward: true

comment:
  layout: "reach, diff, flags, files"
  behavior: default
  require_changes: false
  require_head: yes

github_checks:
  annotations: true

ignore:
  - "tests/"
  - "setup.py"
