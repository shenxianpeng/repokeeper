site_name: RepoKeeper
site_description: AI-powered open source maintainer agent — monitors, maintains, implements
site_url: https://shenxianpeng.dev/repokeeper/
repo_url: https://github.com/shenxianpeng/repokeeper
repo_name: shenxianpeng/repokeeper
edit_uri: edit/main/docs/

theme:
  name: sumi
  accent: "#1f6feb"
  favicon: assets/favicon.svg
  logo: assets/logo.svg

nav:
  - Home: index.md
  - Get Started:
    - Quick Start: quick-start.md
    - Setup: setup.md
    - Release Consistency: release.md
    - GitHub Marketplace: marketplace.md
    - Security: security.md
    - Dogfood Cases: dogfood.md
  - Modules:
    - Community Radar: module-1-radar.md
    - Daily Patrol: module-2-patrol.md
    - Implementation Agent: module-3-agent.md
    - Maintainer Profile: module-4-profile.md
    - Auto-Labeler: module-5-labeler.md
    - Code Review Agent: module-6-review.md
    - Release Notes: module-7-release.md
  - Benchmarks: benchmarks.md
  - Reference:
    - Changelog: changelog.md
    - Profile Schema: reference/profile-schema.md
    - Environment Variables: reference/env-vars.md
    - GitHub Actions: reference/github-actions.md

plugins:
  - search
  - sumi

markdown_extensions:
  - admonition
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets:
      base_path: [docs, .]
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.details
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true

extra:
  social:
    - icon: brand-github
      link: https://github.com/shenxianpeng/repokeeper
    - icon: brand-python
      link: https://pypi.org/project/repokeeper/
  generator: false

copyright: MIT License · RepoKeeper
